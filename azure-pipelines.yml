# Azure DevOps Pipeline for FoodHawk Platform
# Builds Docker images in pipeline and deploys to Azure using free tier services

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - frontend/**
      - terraform/**

pr:
  branches:
    include:
      - main

variables:
  azureRegion: 'eastasia'
  projectName: 'foodhawk'
  environment: 'production'
  dockerTag: '$(Build.BuildId)'

pool:
  vmImage: 'ubuntu-latest'

stages:
# Build Docker Image
- stage: Build
  displayName: 'Build Docker Image'
  jobs:
  - job: Build
    displayName: 'Build Docker Image'
    steps:
    - task: Docker@2
      displayName: 'Build Backend Image'
      inputs:
        repository: 'foodhawk-backend'
        command: 'build'
        Dockerfile: 'backend/Dockerfile'
        tags: |
          latest

    - task: Docker@2
      displayName: 'Save Docker Image'
      inputs:
        repository: 'foodhawk-backend'
        command: 'save'
        arguments: '--output foodhawk-backend.tar foodhawk-backend:latest'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Docker Image Artifact'
      inputs:
        targetPath: 'foodhawk-backend.tar'
        artifact: 'docker-image'
        publishLocation: 'pipeline'

# Deploy to Azure using Terraform
- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToAzure
    displayName: 'Deploy to Azure Free Tier'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Docker Image'
            inputs:
              artifactName: 'docker-image'
              targetPath: '$(System.ArtifactsDirectory)'
          
          - task: Docker@2
            displayName: 'Load Docker Image'
            inputs:
              command: 'load'
              arguments: '--input $(System.ArtifactsDirectory)/foodhawk-backend.tar'
          
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.x'
          
          - task: TerraformInstaller@0
            inputs:
              terraformVersion: 'latest'
          
          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd terraform
                terraform init -upgrade
          
          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd terraform
                terraform apply -auto-approve \
                  -var="azure_region=$(azureRegion)" \
                  -var="project_name=$(projectName)" \
                  -var="environment=$(environment)" \
                  -var="supabase_database_url=$(supabaseDatabaseUrl)" \
                  -var="secret_key=$(secretKey)"
          
          - task: AzureCLI@2
            displayName: 'Login to ACR and Push Image'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd terraform
                ACR_URL=$(terraform output -raw container_registry_url)
                ACR_NAME=$(echo $ACR_URL | cut -d. -f1)
                az acr login --name $ACR_NAME
                docker tag foodhawk-backend:latest ${ACR_URL}/foodhawk-backend:latest
                docker push ${ACR_URL}/foodhawk-backend:latest
          
          - task: AzureCLI@2
            displayName: 'Get Deployment URLs'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd terraform
                echo "Frontend URL: https://$(terraform output -raw frontend_url)"
                echo "Backend URL: https://$(terraform output -raw backend_url)"
                echo "ACR URL: $(terraform output -raw container_registry_url)"
