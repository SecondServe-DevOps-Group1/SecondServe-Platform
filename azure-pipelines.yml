# Azure DevOps Pipeline for FoodHawk Platform
# Builds Docker images in pipeline and deploys to Azure using free tier services

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - frontend/**
      - terraform/**

pr:
  branches:
    include:
      - main

variables:
  azureRegion: 'eastus'
  projectName: 'foodhawk'
  environment: 'production'
  dockerTag: '$(Build.BuildId)'

pool:
  vmImage: 'ubuntu-latest'

stages:
# Build and Push Docker Images to Azure Container Registry
- stage: Build
  displayName: 'Build and Push Docker Images'
  jobs:
  - job: Build
    displayName: 'Build Docker Images'
    steps:
    - task: Docker@2
      displayName: 'Build Backend Image'
      inputs:
        repository: 'foodhawk-backend'
        command: 'build'
        Dockerfile: 'backend/Dockerfile'
        tags: |
          $(dockerTag)
          latest

    - task: AzureCLI@2
      displayName: 'Login to Azure Container Registry'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          ACR_NAME=$(az resource show -g $(projectName)-$(environment)-rg --resource-type Microsoft.ContainerRegistry/registries --query name -o tsv)
          echo "##vso[task.setvariable variable=acrName;isOutput=true]$ACR_NAME"
          az acr login --name $ACR_NAME
      name: loginACR

    - task: Docker@2
      displayName: 'Tag Backend Image for ACR'
      inputs:
        repository: 'foodhawk-backend'
        command: 'tag'
        arguments: 'foodhawk-backend:latest $(acrName).azurecr.io/foodhawk-backend:latest'

    - task: Docker@2
      displayName: 'Push Backend Image to ACR'
      inputs:
        repository: 'foodhawk-backend'
        command: 'push'
        tags: |
          latest
        containerRegistry: '$(azureSubscription)'

# Deploy to Azure using Terraform
- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToAzure
    displayName: 'Deploy to Azure Free Tier'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.x'
          
          - task: TerraformInstaller@0
            inputs:
              terraformVersion: 'latest'
          
          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd terraform
                terraform init -upgrade
          
          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd terraform
                terraform apply -auto-approve \
                  -var="azure_region=$(azureRegion)" \
                  -var="project_name=$(projectName)" \
                  -var="environment=$(environment)" \
                  -var="db_username=$(dbUsername)" \
                  -var="db_password=$(dbPassword)" \
                  -var="secret_key=$(secretKey)"
          
          - task: AzureCLI@2
            displayName: 'Get Deployment URLs'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd terraform
                echo "Frontend URL: https://$(terraform output -raw frontend_url)"
                echo "Backend URL: https://$(terraform output -raw backend_url)"
                echo "ACR URL: $(terraform output -raw container_registry_url)"
